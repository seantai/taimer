<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7236E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="hourglassClip">
      <path d="M380,280 L644,280 C644,280 644,380 512,480 C380,380 380,280 380,280 Z
               M380,744 L644,744 C644,744 644,644 512,544 C380,644 380,744 380,744 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="20" y="20" width="984" height="984" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle inner shadow/highlight -->
  <rect x="20" y="20" width="984" height="984" rx="220" ry="220" fill="white" opacity="0.08"/>

  <!-- Hourglass body outline -->
  <g fill="none" stroke="white" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top bar -->
    <line x1="340" y1="260" x2="684" y2="260"/>
    <!-- Bottom bar -->
    <line x1="340" y1="764" x2="684" y2="764"/>
    <!-- Left side -->
    <path d="M370,260 C370,260 370,400 512,512 C370,624 370,764 370,764"/>
    <!-- Right side -->
    <path d="M654,260 C654,260 654,400 512,512 C654,624 654,764 654,764"/>
  </g>

  <!-- Sand in bottom half -->
  <path d="M410,764 C410,764 410,670 512,590 C614,670 614,764 614,764 Z" fill="white" opacity="0.9"/>

  <!-- Sand trickling -->
  <line x1="512" y1="520" x2="512" y2="590" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- Small sand dots falling -->
  <circle cx="512" cy="505" r="8" fill="white" opacity="0.7"/>
</svg>
